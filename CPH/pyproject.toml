[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cph-section2-platform"
version = "0.1.0"
description = "Chandigarh Police Hackathon — Section 2: Provenance Check, Origin Tracing & Investigator Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CPH Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "networkx>=3.2.1",
    "pyvis>=0.3.2",
    "pillow>=10.2.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
