services:
  detect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cph-detect
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./checkpoints:/app/checkpoints
      - ./models:/app/models
      - ./predictions:/app/predictions
    environment:
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - PRAMAAN_DEVICE=cpu
      - PORT=8001
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cph-internal-net

networks:
  cph-internal-net:
    name: cph-internal-net
    driver: bridge
